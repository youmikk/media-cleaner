name: Native preview (SwiftUI / Compose)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile isolated preview APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MediaCleaner-Native-Android-Preview
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile unsigned device app
        run: |
          xcodebuild -project MediaCleanerNative.xcodeproj -scheme MediaCleanerNative \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package preview IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/MediaCleaner.app build/Payload/
          cd build
          zip -qry MediaCleaner-Native-Preview-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MediaCleaner-Native-iOS-Preview
          path: native/ios/build/MediaCleaner-Native-Preview-unsigned.ipa
          if-no-files-found: error
