name: 构建 Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: '构建完成后自动发布到 Releases(应用内的更新检查读取这里)'
        type: boolean
        default: false
      tag:
        description: '发布标签,例如 v1.0.1(留空则自动取 app.json 里的版本号)'
        type: string
        required: false

# 同时跑两个会争抢 Gradle 缓存。
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux runner 按 1 倍计费,macOS 是 10 倍 —— 安卓不需要 macOS。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # 仅发布 Release 时需要
    env:
      # 提到 job 级别是因为 step 的 `if:` 里读不到 `secrets` 上下文,只能读 `env`。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # RN 0.81 / AGP 8.x 需要 JDK 17;runner 默认版本更高,Gradle 会拒绝。
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        # npm 缓存已由 setup-node 恢复；CI 不需要重新请求 audit/fund 接口。
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: 校验版本号一致
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          PKG=$(node -p "require('./package.json').version")
          APPV=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" src/utils/updateChecker.js)
          RELV=$(node -p "require('./release.json').version")
          echo "app.json=$VERSION package.json=$PKG APP_VERSION=$APPV release.json=$RELV"
          # 四处必须一致,否则打出来的包会汇报一个它自己都不是的版本号,
          # 在线更新检查也会拿错的号去比较。release.json 是 GitHub API
          # 不通时(国内)唯一的版本来源,漏改会让国内用户永远收不到更新。
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$APPV" ] || [ "$VERSION" != "$RELV" ]; then
            echo "::error::版本号不一致:app.json / package.json / APP_VERSION / release.json 四者必须相同"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 依据 app.json 和插件生成 android/,并自动链接 modules/photo-move 本地原生模块。
      - name: 生成 android 工程(expo prebuild)
        run: npx expo prebuild -p android --no-install

      # 必须放在 prebuild 之后:在那之前 Gradle wrapper 还不存在。
      # 不传 build-root-directory —— 该 action 不认这个输入,只会打一条
      # "unexpected input" 警告;缓存本来就是全局配置的,我们手动 cd android 编译。
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 可选。没有这些 secret 时会用 Expo 模板自带的 keystore:一样能装、
      # 一样能覆盖升级(那把 key 是固定的,不是每次构建现生成),只是不能上架 Play。
      - name: 配置正式签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "MC_STORE_FILE=release.keystore"
            echo "MC_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MC_KEY_ALIAS=$KEY_ALIAS"
            echo "MC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties
          node .github/scripts/patch-android-signing.js

      - name: 编译 release APK
        run: |
          cd android
          chmod +x ./gradlew
          # Expo/RN 默认会为 4 个 ABI 编译原生 C++ 模块；发布包只面向
          # 64 位真机，避免 x86 模拟器和 32 位 ABI 消耗大量 CI 时间。
          ./gradlew assembleRelease --no-daemon --stacktrace --parallel --build-cache --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PreactNativeArchitectures=arm64-v8a

      - name: 收集产物
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          OUT="MediaCleaner-${{ steps.meta.outputs.version }}-${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaCleaner-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # 这一步很关键:updateChecker.js 每天扫一次最新 Release,
      # 找到里面的 .apk 资产就提示用户更新。
      - name: 发布到 Releases
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v${{ steps.meta.outputs.version }}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同一个标签下可能已经有 iOS workflow 传上来的 IPA,直接追加。
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          else
            NOTES=$(node -p "
              const e = require('./CHANGELOG.json')[0];
              e && Array.isArray(e.notes) ? e.notes.map(n => '- ' + n).join('\n') : '';
            ")
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "MediaCleaner $TAG" --notes "$NOTES"
          fi
