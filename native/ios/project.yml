name: MediaCleanerNative
options:
  bundleIdPrefix: com.mediacleaner
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    MC_PRERELEASE: "YES"
targets:
  MediaCleanerNative:
    type: application
    platform: iOS
    sources:
      - path: MediaCleanerNative
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediacleaner.app.nativepreview
        PRODUCT_NAME: MediaCleaner
        INFOPLIST_FILE: MediaCleanerNative/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Photos.framework
      - sdk: AVKit.framework
      - sdk: libsqlite3.tbd
schemes:
  MediaCleanerNative:
    build:
      targets:
        MediaCleanerNative: all
